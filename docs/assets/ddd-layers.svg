<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="950" viewBox="0 0 1320 950" role="img" aria-labelledby="title desc">
<title id="title">Domain-driven dependency flow</title><desc id="desc">Business models are independent of NestJS, Prisma, HTTP validation, and external services.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#d8b879"/></marker></defs>
<rect width="1320" height="950" rx="24" fill="#080c15"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="48" y="50" font-size="12" fill="#d8b879" font-weight="700">MMO-PORTAL / ENGINEERING</text><text x="48" y="98" font-size="32" fill="#f4e7d2" font-weight="600">Domain-driven dependency flow</text><text x="48" y="132" font-size="17" fill="#a99f90" font-weight="400">Business models are independent of NestJS, Prisma, HTTP validation, and external services.</text><rect x="48" y="205" width="360" height="190" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="227" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="245" font-size="21" fill="#f4e7d2" font-weight="600">Presentation</text><text x="72" y="281" font-size="16" fill="#a99f90" font-weight="400">Nest controllers / guards</text><text x="72" y="307" font-size="16" fill="#a99f90" font-weight="400">Validated HTTP DTOs</text><text x="72" y="333" font-size="16" fill="#a99f90" font-weight="400">Request identity / receipt mapping</text><rect x="480" y="205" width="360" height="190" rx="16" fill="#111822" stroke="#493e2b"/><rect x="500" y="227" width="4" height="22" rx="2" fill="#d8b879"/><text x="516" y="245" font-size="21" fill="#f4e7d2" font-weight="600">Application</text><text x="504" y="281" font-size="16" fill="#a99f90" font-weight="400">Use cases / plain contracts</text><text x="504" y="307" font-size="16" fill="#a99f90" font-weight="400">Repository and gateway ports</text><text x="504" y="333" font-size="16" fill="#a99f90" font-weight="400">Opaque transaction propagation</text><rect x="912" y="205" width="360" height="190" rx="16" fill="#111822" stroke="#493e2b"/><rect x="932" y="227" width="4" height="22" rx="2" fill="#d8b879"/><text x="948" y="245" font-size="21" fill="#f4e7d2" font-weight="600">Domain</text><text x="936" y="281" font-size="16" fill="#a99f90" font-weight="400">Account / Product / AuctionLot</text><text x="936" y="307" font-size="16" fill="#a99f90" font-weight="400">PaymentOrder / bonus policy</text><text x="936" y="333" font-size="16" fill="#a99f90" font-weight="400">Money / WalletBalance</text><path d="M408 300 L480 300" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 300 L912 300" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="485" width="360" height="190" rx="16" fill="#111822" stroke="#493e2b"/><rect x="500" y="507" width="4" height="22" rx="2" fill="#d8b879"/><text x="516" y="525" font-size="21" fill="#f4e7d2" font-weight="600">Infrastructure</text><text x="504" y="561" font-size="16" fill="#a99f90" font-weight="400">Prisma repositories / UnitOfWork</text><text x="504" y="587" font-size="16" fill="#a99f90" font-weight="400">Game SQL / payment adapters</text><text x="504" y="613" font-size="16" fill="#a99f90" font-weight="400">JWT / bcrypt / Redis / mail</text><path d="M660 485 L660 395" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><text x="680.0" y="440.0" font-size="13" fill="#a99f90" font-weight="400">implements ports</text><rect x="48" y="755" width="1224" height="125" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="777" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="795" font-size="21" fill="#f4e7d2" font-weight="600">Composition roots</text><text x="72" y="831" font-size="16" fill="#a99f90" font-weight="400">Nest modules bind concrete adapters to application constructors through explicit factories.</text><text x="72" y="857" font-size="16" fill="#a99f90" font-weight="400">Architecture tests enforce inward imports; composition tests verify the real module graph.</text>
<text x="48" y="922" font-size="12" fill="#a99f90" font-weight="400">mmo-portal  ·  NestJS / Next.js / SQL Server / Redis</text></g></svg>
