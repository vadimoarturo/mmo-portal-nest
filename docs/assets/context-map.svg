<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="48" y="50" font-size="12" fill="#d8b879" font-weight="700">MMO-PORTAL / ENGINEERING</text><text x="48" y="98" font-size="32" fill="#f4e7d2" font-weight="600">Bounded context map</text><text x="48" y="132" font-size="17" fill="#a99f90" font-weight="400">A modular monolith with explicit ownership and public collaboration ports.</text><rect x="48" y="190" width="380" height="185" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="212" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="230" font-size="21" fill="#f4e7d2" font-weight="600">Identity</text><text x="72" y="266" font-size="16" fill="#a99f90" font-weight="400">Account / credentials / verification</text><text x="72" y="292" font-size="16" fill="#a99f90" font-weight="400">AccountsPort: account summaries</text><text x="72" y="318" font-size="16" fill="#a99f90" font-weight="400">Owns access state and sessions</text><rect x="470" y="190" width="380" height="185" rx="16" fill="#111822" stroke="#493e2b"/><rect x="490" y="212" width="4" height="22" rx="2" fill="#d8b879"/><text x="506" y="230" font-size="21" fill="#f4e7d2" font-weight="600">Wallet</text><text x="494" y="266" font-size="16" fill="#a99f90" font-weight="400">Money / WalletBalance</text><text x="494" y="292" font-size="16" fill="#a99f90" font-weight="400">WalletPort: credit and debit</text><text x="494" y="318" font-size="16" fill="#a99f90" font-weight="400">Owns balances and credit audit</text><rect x="892" y="190" width="380" height="185" rx="16" fill="#111822" stroke="#493e2b"/><rect x="912" y="212" width="4" height="22" rx="2" fill="#d8b879"/><text x="928" y="230" font-size="21" fill="#f4e7d2" font-weight="600">Game integration</text><text x="916" y="266" font-size="16" fill="#a99f90" font-weight="400">GamePort: delivery and gold</text><text x="916" y="292" font-size="16" fill="#a99f90" font-weight="400">SQL anti-corruption adapter</text><text x="916" y="318" font-size="16" fill="#a99f90" font-weight="400">Same-instance transaction writes</text><rect x="48" y="450" width="380" height="185" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="472" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="490" font-size="21" fill="#f4e7d2" font-weight="600">Catalog</text><text x="72" y="526" font-size="16" fill="#a99f90" font-weight="400">Product quote / purchase history</text><text x="72" y="552" font-size="16" fill="#a99f90" font-weight="400">Uses Accounts + Wallet + Game</text><text x="72" y="578" font-size="16" fill="#a99f90" font-weight="400">Active catalog read projections</text><rect x="470" y="450" width="380" height="185" rx="16" fill="#111822" stroke="#493e2b"/><rect x="490" y="472" width="4" height="22" rx="2" fill="#d8b879"/><text x="506" y="490" font-size="21" fill="#f4e7d2" font-weight="600">Auctions</text><text x="494" y="526" font-size="16" fill="#a99f90" font-weight="400">AuctionLot lifecycle / reservation</text><text x="494" y="552" font-size="16" fill="#a99f90" font-weight="400">Uses Accounts + Wallet + Game</text><text x="494" y="578" font-size="16" fill="#a99f90" font-weight="400">Conditional buy / cancel claims</text><rect x="892" y="450" width="380" height="185" rx="16" fill="#111822" stroke="#493e2b"/><rect x="912" y="472" width="4" height="22" rx="2" fill="#d8b879"/><text x="928" y="490" font-size="21" fill="#f4e7d2" font-weight="600">Payments</text><text x="916" y="526" font-size="16" fill="#a99f90" font-weight="400">PaymentOrder / BonusPolicy</text><text x="916" y="552" font-size="16" fill="#a99f90" font-weight="400">Uses Wallet for settlement</text><text x="916" y="578" font-size="16" fill="#a99f90" font-weight="400">Authenticated provider receipts</text><path d="M238 450 L238 375" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><text x="252.0" y="412.5" font-size="13" fill="#a99f90" font-weight="400">account lookup</text><path d="M660 450 L660 375" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><text x="674.0" y="412.5" font-size="13" fill="#a99f90" font-weight="400">wallet transfers</text><path d="M1082 450 L815 375" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><text x="948.5" y="398.5" font-size="13" fill="#a99f90" font-weight="400">WalletPort</text><rect x="48" y="710" width="1224" height="130" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="732" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="750" font-size="21" fill="#f4e7d2" font-weight="600">Rankings · supporting read context</text><text x="72" y="786" font-size="16" fill="#a99f90" font-weight="400">RankingsReadPort → scheduled game projections → Redis cache → public HTTP queries</text><text x="72" y="812" font-size="16" fill="#a99f90" font-weight="400">Contexts collaborate through application ports. Composition roots select concrete adapters.</text>
