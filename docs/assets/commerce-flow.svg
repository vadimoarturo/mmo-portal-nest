<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="680" viewBox="0 0 1320 680" role="img" aria-labelledby="title desc">
<title id="title">Transactional commerce</title><desc id="desc">Decimal arithmetic, conditional state changes, and a shared SQL transaction.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#d8b879"/></marker></defs>
<rect width="1320" height="680" rx="24" fill="#080c15"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="48" y="50" font-size="12" fill="#d8b879" font-weight="700">MMO-PORTAL / ENGINEERING</text><text x="48" y="98" font-size="32" fill="#f4e7d2" font-weight="600">Transactional commerce</text><text x="48" y="132" font-size="17" fill="#a99f90" font-weight="400">Decimal arithmetic, conditional state changes, and a shared SQL transaction.</text><rect x="48" y="195" width="350" height="160" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="217" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="235" font-size="21" fill="#f4e7d2" font-weight="600">Payment settlement</text><text x="72" y="271" font-size="16" fill="#a99f90" font-weight="400">Verify provider signature</text><text x="72" y="297" font-size="16" fill="#a99f90" font-weight="400">Match provider / amount / currency</text><text x="72" y="323" font-size="16" fill="#a99f90" font-weight="400">Conditionally claim NEW order</text><rect x="480" y="195" width="350" height="160" rx="16" fill="#111822" stroke="#493e2b"/><rect x="500" y="217" width="4" height="22" rx="2" fill="#d8b879"/><text x="516" y="235" font-size="21" fill="#f4e7d2" font-weight="600">Marketplace purchase</text><text x="504" y="271" font-size="16" fill="#a99f90" font-weight="400">Validate catalog + quantity</text><text x="504" y="297" font-size="16" fill="#a99f90" font-weight="400">Debit credits with funds predicate</text><text x="504" y="323" font-size="16" fill="#a99f90" font-weight="400">Insert game item delivery</text><rect x="912" y="195" width="350" height="160" rx="16" fill="#111822" stroke="#493e2b"/><rect x="932" y="217" width="4" height="22" rx="2" fill="#d8b879"/><text x="948" y="235" font-size="21" fill="#f4e7d2" font-weight="600">Auction purchase</text><text x="936" y="271" font-size="16" fill="#a99f90" font-weight="400">Conditionally claim active lot</text><text x="936" y="297" font-size="16" fill="#a99f90" font-weight="400">Debit buyer / credit seller</text><text x="936" y="323" font-size="16" fill="#a99f90" font-weight="400">Transfer reserved game gold</text><rect x="245" y="450" width="820" height="155" rx="16" fill="#111822" stroke="#493e2b"/><rect x="265" y="472" width="4" height="22" rx="2" fill="#d8b879"/><text x="281" y="490" font-size="21" fill="#f4e7d2" font-weight="600">One SQL Server transaction</text><text x="269" y="526" font-size="16" fill="#a99f90" font-weight="400">Portal ledger + order state + game inventory updates commit together.</text><text x="269" y="552" font-size="16" fill="#a99f90" font-weight="400">Conditional updates prevent duplicate settlement and double purchases.</text><text x="269" y="578" font-size="16" fill="#a99f90" font-weight="400">An exception rolls back every participating write.</text><path d="M220 355 L420 450" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 355 L655 450" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M1080 355 L900 450" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="652" font-size="12" fill="#a99f90" font-weight="400">mmo-portal  ·  NestJS / Next.js / SQL Server / Redis</text></g></svg>
