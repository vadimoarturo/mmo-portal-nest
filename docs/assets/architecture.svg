<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840" role="img" aria-labelledby="title desc">
<title id="title">System architecture</title><desc id="desc">A single public gateway with explicit application and data boundaries.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#d8b879"/></marker></defs>
<rect width="1320" height="840" rx="24" fill="#080c15"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="48" y="50" font-size="12" fill="#d8b879" font-weight="700">MMO-PORTAL / ENGINEERING</text><text x="48" y="98" font-size="32" fill="#f4e7d2" font-weight="600">System architecture</text><text x="48" y="132" font-size="17" fill="#a99f90" font-weight="400">A single public gateway with explicit application and data boundaries.</text><rect x="48" y="190" width="320" height="135" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="212" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="230" font-size="21" fill="#f4e7d2" font-weight="600">Browser</text><text x="72" y="266" font-size="16" fill="#a99f90" font-weight="400">Localized React UI</text><text x="72" y="292" font-size="16" fill="#a99f90" font-weight="400">Cookie-based sessions</text><rect x="440" y="190" width="350" height="135" rx="16" fill="#111822" stroke="#493e2b"/><rect x="460" y="212" width="4" height="22" rx="2" fill="#d8b879"/><text x="476" y="230" font-size="21" fill="#f4e7d2" font-weight="600">Nginx gateway</text><text x="464" y="266" font-size="16" fill="#a99f90" font-weight="400">/ → web   /api → API</text><text x="464" y="292" font-size="16" fill="#a99f90" font-weight="400">Trusted client-IP boundary</text><rect x="878" y="190" width="390" height="135" rx="16" fill="#111822" stroke="#493e2b"/><rect x="898" y="212" width="4" height="22" rx="2" fill="#d8b879"/><text x="914" y="230" font-size="21" fill="#f4e7d2" font-weight="600">Next.js web</text><text x="902" y="266" font-size="16" fill="#a99f90" font-weight="400">App Router / React Query</text><text x="902" y="292" font-size="16" fill="#a99f90" font-weight="400">EN + RU / reusable UI</text><path d="M368 255 L440 255" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 255 L878 255" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="395" width="350" height="180" rx="16" fill="#111822" stroke="#493e2b"/><rect x="460" y="417" width="4" height="22" rx="2" fill="#d8b879"/><text x="476" y="435" font-size="21" fill="#f4e7d2" font-weight="600">NestJS API</text><text x="464" y="471" font-size="16" fill="#a99f90" font-weight="400">Auth / shop / auctions / stats</text><text x="464" y="497" font-size="16" fill="#a99f90" font-weight="400">DTO validation / rate limiting</text><text x="464" y="523" font-size="16" fill="#a99f90" font-weight="400">Signed payment callbacks</text><path d="M615 325 L615 395" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><text x="627.0" y="360.0" font-size="13" fill="#a99f90" font-weight="400">/api</text><rect x="48" y="635" width="320" height="135" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="657" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="675" font-size="21" fill="#f4e7d2" font-weight="600">SQL Server · Portal</text><text x="72" y="711" font-size="16" fill="#a99f90" font-weight="400">Accounts / credits / orders</text><text x="72" y="737" font-size="16" fill="#a99f90" font-weight="400">Atomic commerce transactions</text><rect x="440" y="635" width="350" height="135" rx="16" fill="#111822" stroke="#493e2b"/><rect x="460" y="657" width="4" height="22" rx="2" fill="#d8b879"/><text x="476" y="675" font-size="21" fill="#f4e7d2" font-weight="600">SQL Server · GameWorld</text><text x="464" y="711" font-size="16" fill="#a99f90" font-weight="400">Game adapter contract</text><text x="464" y="737" font-size="16" fill="#a99f90" font-weight="400">Same instance as Portal</text><rect x="878" y="395" width="390" height="180" rx="16" fill="#111822" stroke="#493e2b"/><rect x="898" y="417" width="4" height="22" rx="2" fill="#d8b879"/><text x="914" y="435" font-size="21" fill="#f4e7d2" font-weight="600">Redis</text><text x="902" y="471" font-size="16" fill="#a99f90" font-weight="400">Shared throttling and cache</text><text x="902" y="497" font-size="16" fill="#a99f90" font-weight="400">Bull notification queue</text><text x="902" y="523" font-size="16" fill="#a99f90" font-weight="400">Retries with exponential backoff</text><rect x="878" y="635" width="390" height="135" rx="16" fill="#111822" stroke="#493e2b"/><rect x="898" y="657" width="4" height="22" rx="2" fill="#d8b879"/><text x="914" y="675" font-size="21" fill="#f4e7d2" font-weight="600">External integrations</text><text x="902" y="711" font-size="16" fill="#a99f90" font-weight="400">SMTP email delivery</text><text x="902" y="737" font-size="16" fill="#a99f90" font-weight="400">FreeKassa / AnyPay / ENOT</text><path d="M520 575 L210 635" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M615 575 L615 635" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 475 L878 475" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M1073 575 L1073 635" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="812" font-size="12" fill="#a99f90" font-weight="400">mmo-portal  ·  NestJS / Next.js / SQL Server / Redis</text></g></svg>
