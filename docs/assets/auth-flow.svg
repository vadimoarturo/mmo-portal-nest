<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="610" viewBox="0 0 1320 610" role="img" aria-labelledby="title desc">
<title id="title">Account and recovery flow</title><desc id="desc">Verification and password reset use distinct signed token purposes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#d8b879"/></marker></defs>
<rect width="1320" height="610" rx="24" fill="#080c15"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="48" y="50" font-size="12" fill="#d8b879" font-weight="700">MMO-PORTAL / ENGINEERING</text><text x="48" y="98" font-size="32" fill="#f4e7d2" font-weight="600">Account and recovery flow</text><text x="48" y="132" font-size="17" fill="#a99f90" font-weight="400">Verification and password reset use distinct signed token purposes.</text><rect x="48" y="195" width="260" height="155" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="217" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="235" font-size="21" fill="#f4e7d2" font-weight="600">Create account</text><text x="72" y="271" font-size="16" fill="#a99f90" font-weight="400">Validate email + password</text><text x="72" y="297" font-size="16" fill="#a99f90" font-weight="400">Hash portal credentials</text><text x="72" y="323" font-size="16" fill="#a99f90" font-weight="400">Queue a verification email</text><rect x="370" y="195" width="260" height="155" rx="16" fill="#111822" stroke="#493e2b"/><rect x="390" y="217" width="4" height="22" rx="2" fill="#d8b879"/><text x="406" y="235" font-size="21" fill="#f4e7d2" font-weight="600">Verify email</text><text x="394" y="271" font-size="16" fill="#a99f90" font-weight="400">Purpose-bound JWT</text><text x="394" y="297" font-size="16" fill="#a99f90" font-weight="400">Enable account access</text><text x="394" y="323" font-size="16" fill="#a99f90" font-weight="400">Issue session cookies</text><rect x="692" y="195" width="260" height="155" rx="16" fill="#111822" stroke="#493e2b"/><rect x="712" y="217" width="4" height="22" rx="2" fill="#d8b879"/><text x="728" y="235" font-size="21" fill="#f4e7d2" font-weight="600">Use the portal</text><text x="716" y="271" font-size="16" fill="#a99f90" font-weight="400">Access + refresh tokens</text><text x="716" y="297" font-size="16" fill="#a99f90" font-weight="400">Server-side authorization</text><text x="716" y="323" font-size="16" fill="#a99f90" font-weight="400">Strict DTO validation</text><rect x="1014" y="195" width="260" height="155" rx="16" fill="#111822" stroke="#493e2b"/><rect x="1034" y="217" width="4" height="22" rx="2" fill="#d8b879"/><text x="1050" y="235" font-size="21" fill="#f4e7d2" font-weight="600">Recover access</text><text x="1038" y="271" font-size="16" fill="#a99f90" font-weight="400">Short-lived reset link</text><text x="1038" y="297" font-size="16" fill="#a99f90" font-weight="400">Bind to current password</text><text x="1038" y="323" font-size="16" fill="#a99f90" font-weight="400">Update both hashes once</text><path d="M308 270 L370 270" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 270 L692 270" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><path d="M952 270 L1014 270" fill="none" stroke="#d8b879" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="420" width="1226" height="125" rx="16" fill="#111822" stroke="#493e2b"/><rect x="68" y="442" width="4" height="22" rx="2" fill="#d8b879"/><text x="84" y="460" font-size="21" fill="#f4e7d2" font-weight="600">Email delivery</text><text x="72" y="496" font-size="16" fill="#a99f90" font-weight="400">API → Redis queue → Bull worker → Handlebars template → SMTP</text><text x="72" y="522" font-size="16" fill="#a99f90" font-weight="400">Queue logs omit reset links, message bodies, and authentication tokens.</text>
<text x="48" y="582" font-size="12" fill="#a99f90" font-weight="400">mmo-portal  ·  NestJS / Next.js / SQL Server / Redis</text></g></svg>
